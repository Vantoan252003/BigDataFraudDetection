services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - fraud_network
    restart: unless-stopped
    mem_limit: 512m

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - fraud_network
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fraud_network
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraud_user} -d ${POSTGRES_DB:-fraud_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: streamlit
    command: streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_HOST=${REDIS_HOST:-fraud_redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - FASTAPI_URL=http://fraud_fastapi:8000
      - FRAUD_API_KEY=${FRAUD_API_KEY}
    volumes:
      - ./scripts:/app/scripts
      - ./security:/app/security
      - ./app/streamlit_app.py:/app/app/streamlit_app.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
      fastapi:
        condition: service_started
    networks:
      - fraud_network
    restart: unless-stopped
    mem_limit: 1g

  producer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    command: python3 scripts/producer.py
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-transactions-data}
      - PAYSIM_PATH=${PAYSIM_PATH:-data/paysim.csv}
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    networks:
      - fraud_network
    restart: unless-stopped
    mem_limit: 2g

  transaction_consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: transaction_consumer
    command: spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.6.0 jobs/transaction_consumer.py
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-transactions-data}
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-fraud_redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PYTHONPATH=/app
    volumes:
      - ./jobs:/app/jobs
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fraud_network
    restart: unless-stopped
    mem_limit: 2g

  trainer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: trainer
    command: spark-submit scripts/train_paysim_model.py
    env_file: .env
    environment:
      - PAYSIM_PATH=${PAYSIM_PATH:-data/paysim.csv}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - PYTHONPATH=/app
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data:ro
    depends_on:
      mlflow:
        condition: service_started
    networks:
      - fraud_network
    mem_limit: 2g
    profiles:
      - jobs

  blacklist_loader:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: blacklist_loader
    command: spark-submit scripts/blacklist_loader.py
    env_file: .env
    environment:
      - PAYSIM_PATH=${PAYSIM_PATH:-data/paysim.csv}
      - REDIS_HOST=${REDIS_HOST:-fraud_redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PYTHONPATH=/app
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fraud_network
    mem_limit: 2g
    profiles:
      - jobs

  # Redis — blacklist lookup sub-millisecond (with password protection)
  redis:
    image: redis:7-alpine
    container_name: fraud_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-r3d1s_s3cur3_p@ss} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    env_file: .env
    networks:
      - fraud_network
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-r3d1s_s3cur3_p@ss}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafdrop — Kafka topic browser UI
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: fraud_kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fraud_network
    restart: unless-stopped
    mem_limit: 256m

  # MLflow — model registry & experiment tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: fraud_mlflow
    ports:
      - "5050:5000"
    volumes:
      - ./scripts:/app/scripts
      - ./mlflow:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    networks:
      - fraud_network
    restart: unless-stopped
    mem_limit: 512m

  # FastAPI — REST endpoint để inject transaction thủ công (secured)
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: fraud_fastapi
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-transactions-data}
      FRAUD_API_KEY: ${FRAUD_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./scripts:/app/scripts
      - ./security:/app/security
      - ./app/fastapi_app.py:/app/fastapi_app.py
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fraud_network
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MinIO: S3-compatible object storage cho Delta Lake ────────────
  minio:
    image: minio/minio:RELEASE.2024-06-04T19-20-08Z
    container_name: fraud_minio
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"    # S3 API (dùng 9002 tránh conflict với Kafdrop)
      - "9001:9001"    # MinIO Console UI
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - fraud_network
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: tạo buckets fraud-lakehouse, mlflow-artifacts, spark-checkpoints
  minio-init:
    image: minio/mc:latest
    container_name: fraud_minio_init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./docker/minio-init.sh:/init.sh:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - fraud_network
    restart: no

  # ── Apache Airflow ─────────────────────────────────────────────────
  # Khởi tạo DB + tạo user admin — chạy 1 lần rồi exit
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_init
    user: root
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Fraud --lastname Admin --role Admin --email admin@fraud.local
      "
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fraud_network
    restart: no

  # Airflow Webserver — UI tại http://localhost:8080
  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_webserver
    user: root
    command: airflow webserver
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${SECRET_KEY}
      # Env vars truyền cho DAGs
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock  # Cho phép DAG chạy docker exec
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud_network
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Airflow Scheduler — điều phối và kích hoạt các DAG tasks
  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_scheduler
    user: root
    command: airflow scheduler
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud_network
    restart: unless-stopped
    mem_limit: 1g

networks:
  fraud_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  airflow_logs:
