services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - fraud_network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - fraud_network

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
      POSTGRES_DB: fraud_db
    ports:
      - "5432:5432"
    networks:
      - fraud_network

      
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: streamlit
    command: streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://fraud_user:fraud_pass@postgres:5432/fraud_db
      - REDIS_HOST=fraud_redis
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FASTAPI_URL=http://fraud_fastapi:8000
    volumes:
      - ./scripts:/app/scripts
      - ./app/streamlit_app.py:/app/app/streamlit_app.py
    depends_on:
      - postgres
      - redis
      - mlflow
      - fastapi
    networks:
      - fraud_network

  producer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    command: python3 scripts/producer.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=transactions-data
      - PAYSIM_PATH=data/paysim.csv
    depends_on:
      - kafka
    networks:
      - fraud_network

  transaction_consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    command: spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.6.0 jobs/transaction_consumer.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=transactions-data
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/fraud_db
      - POSTGRES_USER=fraud_user
      - POSTGRES_PASSWORD=fraud_pass
      - REDIS_HOST=fraud_redis
    volumes:
      - ./jobs:/app/jobs
    depends_on:
      - kafka
      - postgres
      - redis
    networks:
      - fraud_network

  trainer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    command: spark-submit scripts/train_paysim_model.py
    environment:
      - PAYSIM_PATH=data/paysim.csv
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./scripts:/app/scripts
    depends_on:
      - mlflow
    networks:
      - fraud_network

  blacklist_loader:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    command: spark-submit scripts/blacklist_loader.py
    environment:
      - PAYSIM_PATH=data/paysim.csv
      - REDIS_HOST=fraud_redis
    volumes:
      - ./scripts:/app/scripts
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fraud_network

  # Redis — blacklist lookup sub-millisecond
  redis:
    image: redis:7-alpine
    container_name: fraud_redis
    ports:
      - "6380:6379"
    networks:
      - fraud_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafdrop — Kafka topic browser UI
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: fraud_kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      - kafka
    networks:
      - fraud_network

  # MLflow — model registry & experiment tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: fraud_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./scripts:/app/scripts
      - ./mlflow:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    networks:
      - fraud_network

  # FastAPI — REST endpoint để inject transaction thủ công
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: fraud_fastapi
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: transactions-data
    volumes:
      - ./scripts:/app/scripts
      - ./app/fastapi_app.py:/app/fastapi_app.py
    depends_on:
      - kafka
    networks:
      - fraud_network

networks:
  fraud_network:
    driver: bridge
