# ══════════════════════════════════════════════════════════════════
# Docker Compose — Lightweight Demo Configuration  
# Dùng khi demo cho thầy: giảm RAM, dùng demo data nhỏ
# Usage: docker compose -f docker-compose.demo.yml up -d --build
# ══════════════════════════════════════════════════════════════════

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: demo_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - demo_network
    mem_limit: 256m

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: demo_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    networks:
      - demo_network
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: demo_postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud_pass_S3cur3!}
      POSTGRES_DB: ${POSTGRES_DB:-fraud_db}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - demo_network
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: demo_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-r3d1s_s3cur3_p@ss} --maxmemory 128mb
    ports:
      - "6380:6379"
    env_file: .env
    networks:
      - demo_network
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-r3d1s_s3cur3_p@ss}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: demo_mlflow
    ports:
      - "5050:5000"
    volumes:
      - ./mlflow:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    networks:
      - demo_network
    mem_limit: 256m

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: demo_streamlit
    command: streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-fraud_user}:${POSTGRES_PASSWORD:-fraud_pass_S3cur3!}@postgres:5432/${POSTGRES_DB:-fraud_db}
      - REDIS_HOST=demo_redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-r3d1s_s3cur3_p@ss}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FASTAPI_URL=http://demo_fastapi:8000
      - FRAUD_API_KEY=${FRAUD_API_KEY}
    volumes:
      - ./scripts:/app/scripts
      - ./security:/app/security
      - ./app/streamlit_app.py:/app/app/streamlit_app.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demo_network
    mem_limit: 512m

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: demo_fastapi
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: transactions-data
      FRAUD_API_KEY: ${FRAUD_API_KEY}
    volumes:
      - ./app/fastapi_app.py:/app/fastapi_app.py
      - ./security:/app/security
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - demo_network
    mem_limit: 256m

  # Producer dùng demo data nhỏ
  producer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    command: python3 scripts/producer.py
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=transactions-data
      - PAYSIM_PATH=data/demo_paysim.csv
      - PRODUCER_DELAY=0.5
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - demo_network
    mem_limit: 1g

  transaction_consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    command: spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.6.0 jobs/transaction_consumer.py
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=transactions-data
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fraud_db}
      - POSTGRES_USER=${POSTGRES_USER:-fraud_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fraud_pass_S3cur3!}
      - REDIS_HOST=demo_redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-r3d1s_s3cur3_p@ss}
    volumes:
      - ./jobs:/app/jobs
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demo_network
    mem_limit: 1g

networks:
  demo_network:
    driver: bridge
