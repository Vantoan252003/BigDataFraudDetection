name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pyspark requests pandas sqlalchemy

    - name: Run unit tests
      run: |
        pytest tests/ -v
        
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build Consumer Docker image
      run: docker build -f Dockerfile.consumer -t frauddetectionsystem-consumer:latest .

    - name: Build FastAPI Docker image
      run: docker build -f Dockerfile.fastapi -t frauddetectionsystem-fastapi:latest .
