name: CI/CD Pipeline — Fraud Detection System

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Job 1: Test ─────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pyspark requests pandas sqlalchemy cryptography

    - name: Run security tests
      run: pytest tests/test_security.py -v

    - name: Run all tests
      run: pytest tests/ -v --tb=short

  # ── Job 2: Build Docker Images ──────────────────────────────────
  docker-build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Consumer image
      run: docker build -f Dockerfile.consumer -t fraud-consumer:${{ github.sha }} .

    - name: Build FastAPI image
      run: docker build -f Dockerfile.fastapi -t fraud-fastapi:${{ github.sha }} .

    - name: Verify images
      run: docker images | grep fraud

  # ── Job 3: Deploy to Oracle Cloud ──────────────────────────────
  deploy:
    name: Deploy to Oracle Cloud
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
    - uses: actions/checkout@v4

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.ORACLE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

    - name: Deploy to server
      env:
        HOST: ${{ secrets.ORACLE_HOST }}
        USER: ${{ secrets.ORACLE_USER }}
      run: |
        SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${USER}@${HOST}"

        echo "Pulling latest code..."
        $SSH_CMD "cd ~/BigDataFraudDetection && git pull origin main"

        echo "Restarting services..."
        $SSH_CMD "cd ~/BigDataFraudDetection && sudo docker compose pull 2>/dev/null; sudo docker compose up -d --build --remove-orphans"

        echo "Waiting for services to be healthy..."
        sleep 30

        echo "Checking service health..."
        $SSH_CMD "cd ~/BigDataFraudDetection && sudo docker compose ps"

    - name: Verify deployment
      env:
        HOST: ${{ secrets.ORACLE_HOST }}
      run: |
        echo "Checking Streamlit..."
        curl -sf http://${HOST}:8501 > /dev/null && echo "Streamlit OK" || echo "Streamlit not reachable"

        echo "Checking FastAPI..."
        curl -sf http://${HOST}:8000/health > /dev/null && echo "FastAPI OK" || echo "FastAPI not reachable"
